<div class="task-card">
    @for (task of tasksList; track task.id) {
        @if (isSameUser(task.userId)) {
            <h3> {{task.title}} </h3>
            <p> {{ task.summary }} </p>
            <p> {{ task.dueDate }} </p>
            <button type="button" (click)="removeTask(task.id)">Eliminar</button>
        }
    }
</div>
